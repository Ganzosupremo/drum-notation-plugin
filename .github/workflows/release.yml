name: Release

# Publishes a GitHub release with the BRAT/manual install assets when a
# version tag is pushed. Tags with a pre-release suffix (e.g. 1.2.0-beta.1)
# become pre-releases.
on:
    push:
        tags: ["*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci
            - run: npm run test:unit
            - run: npm run package
            - name: Check manifest version matches tag
              run: |
                  version=$(node -p "require('./manifest.json').version")
                  if [ "$version" != "$GITHUB_REF_NAME" ]; then
                      echo "manifest.json version $version does not match tag $GITHUB_REF_NAME"
                      exit 1
                  fi
            - name: Extract changelog notes
              run: |
                  awk -v tag="## $GITHUB_REF_NAME" '$0 == tag { found = 1; next } /^## / && found { exit } found' CHANGELOG.md > release-notes.md
                  test -s release-notes.md || echo "Release $GITHUB_REF_NAME" > release-notes.md
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  prerelease=""
                  case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
                  gh release create "$GITHUB_REF_NAME" \
                      release/main.js release/manifest.json release/styles.css release/drum-notation-renderer-mobile.zip \
                      --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
